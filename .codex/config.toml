default_permissions = "safe-workspace"

[permissions.safe-workspace.filesystem]
glob_scan_max_depth = 4

# Allow normal work in the repo, but deny .secrets
":project_roots" = {
  "." = "write",
  ".secrets" = "none",
  "**/.secrets" = "none",
  "**/*.secrets" = "none",
  "**/.env*" = "none"
}

# Optional: also block a specific absolute path
# "/absolute/path/to/.secrets" = "none"
